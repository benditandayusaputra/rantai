  batas_waktu_baca: 10s
  batas_waktu_tulis: 120s
  batas_waktu_henti: 10s
  batas_laju:
    maks_permintaan: 120
    jendela: 1m
  cors:
    origin:
      - http://localhost:5173
  tanya:
    batas_laju:
      maks_permintaan: 20
      jendela: 1h
    batas_waktu: 90s
  auth:
    batas_laju:
      maks_permintaan: 30
      jendela: 15m
    otp:
      umur: 10m
      maks_percobaan: 5
      maks_permintaan: 3
      jendela_permintaan: 1h
    umur_akses: 15m
    umur_refresh: 168h

peta:
  toleransi_penyederhanaan: 0.0003
  desimal_koordinat: 5

sekolah_terdekat:
  radius_bawaan_m: 3000
  radius_maksimal_m: 10000
