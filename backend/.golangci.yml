version: "2"

linters:
  enable:
    - funlen
    - gocritic
    - errorlint
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
  settings:
    funlen:
      lines: 30
      statements: 25
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen

formatters:
  enable:
    - gofmt
